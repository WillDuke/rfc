name: PR Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: site-preview
          path: _site/

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            **Site preview rendered successfully.**

            Download the preview artifact from the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to inspect locally.

            _Updated: ${{ github.event.pull_request.head.sha }}_
